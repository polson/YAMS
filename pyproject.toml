[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yams-worker"
version = "0.1.0"
description = "In-place INI song separation with verified originals and recoverable installation"
requires-python = ">=3.11"

[project.scripts]
yams = "yams.__main__:main"

[tool.setuptools.packages.find]
include = ["yams*"]

[tool.setuptools.package-data]
yams = ["model_assets.json"]
