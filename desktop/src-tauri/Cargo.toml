[package]
name = "yams-desktop"
version = "0.2.0"
edition = "2021"
license = "MIT"

[lib]
name = "yams_desktop"
path = "src/lib.rs"

[[bin]]
name = "yams-desktop"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-plugin-dialog", "dep:tauri-plugin-process", "dep:tauri-plugin-updater", "dep:tauri-build"]

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [], optional = true }
tauri-plugin-dialog = { version = "2", optional = true }
tauri-plugin-process = { version = "2.4.0", optional = true }
tauri-plugin-updater = { version = "2.13.3", optional = true }
